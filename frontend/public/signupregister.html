<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="user-session.js"></script>
    <script src="appearance.js" defer></script>
    <link rel="stylesheet" href="appearance.css">

    <style>

body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #ebadad;
    font-family: Arial, sans-serif;
}

/* Main Container Styles */
.container {
    width: 350px;    /* Increased width */
    height: 530px;   /* Increased height */
    border-radius: 20px;
    position: relative;
    background: rgb(255, 235, 235); 
    padding: 0%;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1); 
    
    /* Move the container slightly upward */
    margin-top: -20px;  /* Moves it 20px upward */
    
    /* Alternative method for smoother positioning */
    /* transform: translateY(-20px); */
}


/* Heading */
.head-title {
    font-size: 18px; 
    margin-top: 20px; 
    text-align: center; /* Center the heading */
}

/* Labels */
label {
    font-size: 14px;
    font-weight: bold;
    display: block;
    margin-top: 15px;
    position: relative;
    margin-left: 30px;
}

/* Input Fields */
input {
    width: 280px;  /* Slightly wider */
    height: 32px;  /* Slightly taller */
    background: white;
    box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
    border-radius: 10px;
    border: 1px solid #ffffff;
    margin: 10px auto;
    display: flex;
    align-items: center;
    font-size: 12px;
    padding-left: 12px; 
    text-align: left;
    transition: border-color 0.3s ease-in-out;
}

input:focus {
    border: 2px solid rgb(255, 172, 172); 
    outline: none; 
}

/* Note */
.note {
    font-size: 11px;
    color: gray;
}

/* Button */
.btn {
    width: 120px; 
    height: 32px; 
    background: #fcb0b0; 
    color: white;
    text-decoration: none;
    border: none;
    border-radius: 30px;
    font-size: 17px;
    font-family: "Alkatra", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 40px auto 20px; 
    cursor: pointer;
    position: relative;
    z-index: 2;
}

.btn:hover {
    background-color: #ff9797;
}

/* Back Button */
.back-logo {
    position: fixed; /* Fixed position for dynamic movement */
    top: 50px;       /* Increased value to move it downward */
    left: 20px;       /* Positioned on the left side */
    z-index: 10;      /* Ensures it's above other elements */
}

.back-logo img {
    width: 20px;      /* Adjust size as needed */
    height: auto;
    cursor: pointer;
}

.back-loco img {
    width: 12px; /* Increased size */
    height: auto;
    cursor: pointer;
}

/* Error Message */
.error-msg {
    color: red;
    font-size: 12px;
    position: absolute;
    margin-top: -53px;
    margin-left: 30px;
    display: none;
}


.loading-overlay {
    position: fixed;
    top: 0px; /* Moves the overlay up */
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.7); /* Dark background with transparency */
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    font-size: 20px;
    z-index: 9999; /* Ensure it appears above everything */
}

.hidden {
    display: none;
}

.spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #ffffff;
    border-top: 4px solid #ff6f6f; /* Highlight spinner */
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-right: 10px;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

</style>
</head>
<body>
    <div class="container">
        <div class="head-title">Sign Up</div>

        <div class="back-logo">
            <a href="N-foodloginpage.html" class="back-log">
                <div class="back-loco">
                    <img src="static/pngkey.com-menu-icon-png-9694963.png" alt="back-button">
                </div>
            </a>
        </div>

        <form id="signupForm" method="POST" action="/signup">
            <div class="input-group">
                <label for="firstName">First Name</label>
                <input type="text" name="firstName" id="firstName">
                <span class="error-msg" id="firstNameError">* Required</span>
            </div>

            <div class="input-group">
                <label for="lastName">Last Name</label>
                <input type="text" name="lastName" id="lastName">
                <span class="error-msg" id="lastNameError">* Required</span>
            </div>

            <div class="input-group">
                <label for="nickName">Nick Name <span class="note">(View on profile)</span></label>
                <input type="text" name="nickName" id="nickName">
                <span class="error-msg" id="nickNameError">* Required</span>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email">
                <span class="error-msg" id="emailError">* Invalid email</span>
            </div>

            <div class="input-group">
                <label for="mobile">Mobile Number</label>
                <input type="number" name="mobile" id="mobile">
                <span class="error-msg" id="mobileError">* Invalid number</span>
            </div>

            <div>
                <button type="submit" class="btn">Next</button>

            </div>
    </div>

    <div id="loading-screen" class="loading-overlay hidden">
        <div class="spinner"></div>
        <span>Processing...</span>
    </div>
    

    <script>
        document.getElementById("signupForm").addEventListener("submit", async function (e) {
            e.preventDefault(); // Prevent default form submit
        
            let isValid = true;
        
            function showError(id, condition) {
                const errorElement = document.getElementById(id);
                if (condition) {
                    errorElement.style.display = "inline";
                    isValid = false;
                } else {
                    errorElement.style.display = "none";
                }
            }
        
            const firstName = document.getElementById("firstName").value.trim();
            const lastName = document.getElementById("lastName").value.trim();
            const nickName = document.getElementById("nickName").value.trim();
            const email = document.getElementById("email").value.trim();
            const mobile = document.getElementById("mobile").value.trim();
        
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            showError("firstNameError", firstName === "");
            showError("lastNameError", lastName === "");
            showError("nickNameError", nickName === "");
            showError("emailError", email === "" || !emailRegex.test(email));
            showError("mobileError", mobile === "" || mobile.length !== 10);
        
            if (isValid) {
                const loadingScreen = document.getElementById("loading-screen");
                loadingScreen.classList.remove("hidden");
        
                try {
                    const response = await fetch("/signup", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            firstName,
                            lastName,
                            nickName,
                            email,
                            mobile
                        })
                    });
        
                    if (response.ok) {
                        // ✅ Save to sessionStorage and localStorage for next steps
                        sessionStorage.setItem("profileName", nickName);
                        sessionStorage.setItem("profileEmail", email);
                        sessionStorage.setItem("profilePhone", mobile);
                        localStorage.setItem("profileName", nickName);
                        localStorage.setItem("profileEmail", email);
                        localStorage.setItem("profilePhone", mobile);

                        if (window.UserSession) {
                            window.UserSession.clearLegacyKeys();
                        }
                             
                        window.location.href = "passcnfm.html";
                    } else {
                        const msg = await response.text();
                        alert("Signup failed: " + msg);
                    }
                } catch (error) {
                    alert("Error: " + error.message);
                } finally {
                    loadingScreen.classList.add("hidden");
                }
            }
        });
        </script>
        
</body>
</html>
